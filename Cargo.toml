[package]
name = "easy-glucose"
version = "1.3.0"
edition = "2024"
rust-version = "1.90"
description = "A quiet, native glucose companion"
license = "MIT"

[dependencies]
velopack = "=1.2.161"
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui_plot = "=0.34.1"
egui_extras = { version = "=0.33.3", default-features = false, features = ["svg"] }
tokio = { version = "1.48", features = ["rt", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
tempfile = "3"
zeroize = { version = "1", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
thiserror = "2"
fs2 = "0.4"
sha2 = "0.10"
sha1 = "0.10"
hound = "3.5"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
rfd = "0.15"
notify-rust = { version = "4.19", features = ["preview-macos-un"] }
sys-locale = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
auto-launch = "0.6"

[dev-dependencies]
tokio = { version = "1.48", features = ["net", "io-util"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSScreen", "NSStatusItem", "NSStatusBarButton", "NSView", "NSWindow"] }
